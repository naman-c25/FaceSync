[pytest]
testpaths = tests
markers =
    slow: loads real models — skip with `-m "not slow"` for a fast feedback loop

# MediaPipe and ONNX Runtime both log loader chatter through native code that
# pytest cannot capture, and MediaPipe's FaceLandmarker raises inside __del__
# during interpreter shutdown. Neither affects results; both drown the report.
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
