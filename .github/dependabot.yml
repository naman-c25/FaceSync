# Keeps the pinned dependencies from rotting.
#
# Pinning without this is only half the job: exact versions make a build
# reproducible, and then quietly leave it reproducing a year-old tree with a
# year of unpatched CVEs in it. This is the other half.
#
# Everything is grouped, because the alternative is unusable. requirements.txt
# alone pins 60 packages, transitive ones included, and ungrouped Dependabot
# would open a pull request per package per week until nobody read any of them.
# Low-risk updates arrive as one reviewable pull request; major versions come
# on their own, because those are the ones worth thinking about.
#
# The Docker ecosystem is deliberately absent. `python:3.12-slim` and
# `node:22-slim` float on purpose -- floating is what keeps OS security patches
# arriving, and the CI image-build job is what catches a base image that breaks
# the build. Adding Docker here would only produce pull requests proposing
# Python 3.13 and Node 24, which is a decision to make deliberately rather than
# to be nudged into weekly. See the note in DEPLOY.md.

version: 2

updates:
  # --- Node: the API layer ---------------------------------------------------
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      backend-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, backend]

  # --- Node: the four frontends ---------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  # --- Python: the ML service -----------------------------------------------
  # Picks up requirements.txt and requirements-dev.txt both. The ML stack is
  # where a major version genuinely can change behaviour rather than just the
  # API -- a different onnxruntime or numpy can move a score -- so majors stay
  # ungrouped and the test suite is what decides whether they land.
  - package-ecosystem: pip
    directory: /ml-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ml-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, ml-service]

  # --- The workflows themselves ---------------------------------------------
  # actions/checkout@v4 and friends are floating major tags, so this mostly
  # catches the majors. Worth having: a stale action is the one part of CI that
  # never fails loudly, it just stops being maintained.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]
